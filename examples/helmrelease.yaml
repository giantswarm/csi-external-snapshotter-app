# csi-external-snapshotter-app for the workload cluster democluster.
#
# All three objects live on the management cluster (grouse) in the cluster's org
# namespace. The chart installs into the workload cluster via
# kubeConfig.secretRef:
#
#   kubectl --kubeconfig ~/.kube/grouse apply -f examples/helmrelease.yaml
#
# For another cluster, replace democluster/org-demo with the cluster name and
# its org namespace. The kubeconfig secret, the CNI release and the per-cluster
# HelmRepositories are created by the cluster chart, so they already exist:
#
#   kubectl -n org-demo get secret democluster-kubeconfig
#   kubectl -n org-demo get helmrepository democluster-giantswarm
#
# Pinned to the dev build from PR #56 (commit f666cd1) in
# giantswarm-test-catalog. Once v0.4.0 is released, drop the HelmRepository
# below and change the HelmRelease to:
#
#     version: 0.4.0
#     sourceRef:
#       name: democluster-giantswarm       # already exists, giantswarm-catalog
#
# Labels mirror the cluster-chart-rendered releases in org-demo, minus the
# meta.helm.sh/* annotations and the managed-by:Helm label, so nothing mistakes
# this for part of the democluster cluster-chart release.
---
# Only needed while the chart is pre-release: the cluster chart creates
# per-cluster HelmRepositories for default, default-test, cluster, cluster-test
# and giantswarm, but not for giantswarm-test-catalog.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: democluster-giantswarm-test
  namespace: org-demo
  labels:
    giantswarm.io/cluster: democluster
    giantswarm.io/organization: demo
spec:
  interval: 5m
  url: https://giantswarm.github.io/giantswarm-test-catalog
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: democluster-csi-external-snapshotter-user-values
  namespace: org-demo
  labels:
    giantswarm.io/cluster: democluster
    giantswarm.io/organization: demo
data:
  # Read by Flux from this namespace on the management cluster, not from the
  # workload cluster.
  values: |
    # CRDs are applied by a pre-install/pre-upgrade hook job rather than by
    # Helm, so they survive deletion of the release.
    crds:
      install: true
    # Velero needs a VolumeSnapshotClass for the driver it snapshots through.
    # democluster runs vsphere-csi-driver, whose provisioner is
    # csi.vsphere.vmware.com.
    defaults:
      volumesnapshotclass:
        create: true
        name: csi-vsphere-snapshot-class
        driver: csi.vsphere.vmware.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democluster-csi-external-snapshotter
  namespace: org-demo
  labels:
    cluster-apps-operator.giantswarm.io/watching: ""
    cluster.x-k8s.io/cluster-name: democluster
    giantswarm.io/cluster: democluster
    giantswarm.io/organization: demo
    giantswarm.io/service-priority: highest
    application.giantswarm.io/team: rocket
spec:
  suspend: false
  releaseName: csi-external-snapshotter
  # Installs into the workload cluster, not the MC.
  kubeConfig:
    secretRef:
      name: democluster-kubeconfig
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: csi-external-snapshotter-app
      version: 0.3.1-dev.upgrade-to-v8-6-0.2026-08-05.16-08-37.hf666cd1
      sourceRef:
        kind: HelmRepository
        name: democluster-giantswarm-test
  # Same dependency the cluster chart gives the CSI driver release: the CNI has
  # to be up before the controller can reach the API server.
  dependsOn:
    - name: democluster-cilium
      namespace: org-demo
  interval: 5m
  timeout: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  valuesFrom:
    - kind: ConfigMap
      name: democluster-csi-external-snapshotter-user-values
      valuesKey: values
