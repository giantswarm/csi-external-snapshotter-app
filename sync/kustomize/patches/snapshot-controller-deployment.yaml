apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapshot-controller
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: snapshot-controller
      containers:
        - name: snapshot-controller
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: '{{ .Values.snapshotController.resources.requests.cpu }}'
              memory: '{{ .Values.snapshotController.resources.requests.memory }}'
            limits:
              cpu: '{{ .Values.snapshotController.resources.limits.cpu }}'
              memory: '{{ .Values.snapshotController.resources.limits.memory }}'
