crds:
  # Install the snapshot CRDs. They ship as the csi-external-snapshotter-crds
  # dependency chart and carry `helm.sh/resource-policy: keep`, so Helm manages
  # them on install and upgrade but leaves them in place on uninstall.
  install: true
  adopt:
    # One-shot migration hook. Chart versions up to 0.3.x installed the CRDs with
    # a `kubectl apply` job, which leaves them without Helm ownership metadata --
    # `helm upgrade` then fails with "invalid ownership metadata". This job hands
    # ownership over to Helm before the release is applied. It is a no-op on a
    # fresh install and can be disabled once every cluster has been through a
    # 0.4.0 or later release.
    enabled: true
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"

dockerKubectl:
  image: quay.io/giantswarm/docker-kubectl
  tag: "1.33.4"

snapshotController:
  image: registry.k8s.io/sig-storage/snapshot-controller
  # kept in sync with the upstream ref in vendir.yml by `make sync`
  tag: IMAGE_TAG
  resources:
    requests:
      memory: "64Mi"
      cpu: "10m"
    limits:
      memory: "256Mi"
      cpu: "200m"

defaults:
  volumesnapshotclass:
    create: false
    name: ""
    driver: ""
