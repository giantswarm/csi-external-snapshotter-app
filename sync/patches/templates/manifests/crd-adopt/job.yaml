{{- if eq (include "crdAdoptEnabled" .) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "crdAdopt" . }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    # create hook dependencies in the right order
    "helm.sh/hook-weight": "-1"
    {{- include "crdAdoptAnnotations" . | nindent 4 }}
  labels:
    app.kubernetes.io/component: {{ include "crdAdopt" . | quote }}
    {{- include "labels.common" . | nindent 4 }}
    role: {{ include "crdAdoptSelector" . | quote }}
spec:
  # Helm's hook-delete-policy already removes the job, this is a backstop for
  # the case where the release is deleted before the hook is cleaned up.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ include "crdAdopt" . | quote }}
        {{- include "labels.common" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "crdAdopt" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
      containers:
      - name: kubectl
        image: "{{ .Values.dockerKubectl.image }}:{{ .Values.dockerKubectl.tag }}"
        command:
        - sh
        - -c
        - |
          set -o errexit ; set -o xtrace ; set -o nounset

          # Hand ownership of pre-existing CRDs over to Helm. Chart versions up
          # to 0.3.x applied the CRDs with `kubectl apply` from a hook job, so
          # they carry no Helm metadata and `helm upgrade` refuses to take them
          # over with "invalid ownership metadata".
          #
          # Idempotent, and a no-op on a fresh install: every CRD that does not
          # exist yet is skipped, because `kubectl annotate` has no
          # --ignore-not-found and would fail the hook.
          #
          # piping stderr to stdout means kubectl's errors are surfaced in the
          # pod's logs.
          for crd in {{ include "crdNames" . }}; do
            if ! kubectl get crd "${crd}" >/dev/null 2>&1; then
              continue
            fi
            kubectl annotate crd "${crd}" --overwrite \
              "meta.helm.sh/release-name={{ .Release.Name }}" \
              "meta.helm.sh/release-namespace={{ .Release.Namespace }}" 2>&1
            kubectl label crd "${crd}" --overwrite \
              "app.kubernetes.io/managed-by=Helm" 2>&1
          done
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources: {{- toYaml .Values.crds.adopt.resources | nindent 10 }}
      restartPolicy: Never
  backoffLimit: 4
{{- end }}
