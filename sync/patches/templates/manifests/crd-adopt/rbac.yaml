{{- if eq (include "crdAdoptEnabled" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "crdAdopt" . }}
  annotations:
    # create hook dependencies in the right order
    "helm.sh/hook-weight": "-3"
    {{- include "crdAdoptAnnotations" . | nindent 4 }}
  labels:
    app.kubernetes.io/component: {{ include "crdAdopt" . | quote }}
    {{- include "labels.common" . | nindent 4 }}
    role: {{ include "crdAdoptSelector" . | quote }}
rules:
# The hook only relabels CRDs that already exist. Creating and deleting them is
# Helm's job now, so it does not need those verbs.
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "crdAdopt" . }}
  annotations:
    # create hook dependencies in the right order
    "helm.sh/hook-weight": "-2"
    {{- include "crdAdoptAnnotations" . | nindent 4 }}
  labels:
    app.kubernetes.io/component: {{ include "crdAdopt" . | quote }}
    {{- include "labels.common" . | nindent 4 }}
    role: {{ include "crdAdoptSelector" . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "crdAdopt" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "crdAdopt" . }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
