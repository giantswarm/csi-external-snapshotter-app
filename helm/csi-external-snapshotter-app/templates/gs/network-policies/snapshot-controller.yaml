kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: snapshot-controller
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: snapshot-controller
  egress:
  - ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
  ingress: []
  policyTypes:
  - Egress
  - Ingress
